[project]
name = "waseem-django-template"
version = "1.0.0"
description = "A Cruft-compatible Django project generator."
requires-python = ">=3.14,<3.15"
readme = "README.md"
dependencies = [
  "cookiecutter>=2.7,<3",
  "cruft>=2.16,<3",
  "pre-commit>=4.5,<5",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "template: renders every supported Cookiecutter shape",
  "template_integration: exercises generated management commands",
  "template_upgrade: verifies a Cruft update preserves product extensions",
]
