<div
  class="relative"
  x-data='searchSelect({ inputId: "{{ input_id }}", selectedKey: "{{ selected_key|escapejs }}", query: "{{ query|escapejs }}", options: {{ options_json|safe }}, onChoose() { {{ on_choose }} } })'
  @click.outside="closeMenu(true)"
>
  <input type="hidden" name="{{ hidden_name }}" x-model="selectedKey" />
  <div class="relative">
    <input
      id="{{ input_id }}"
      type="search"
      class="input input-bordered input-sm w-full pr-8 {{ input_class }}"
      :class="isInvalid ? 'input-error border-error text-error focus:border-error focus:outline-error' : ''"
      autocomplete="off"
      placeholder="{{ placeholder }}"
      x-model="query"
      @focus="focusInput(); $event.target.select()"
      @input="search()"
      @keydown.arrow-down.prevent="highlightNext()"
      @keydown.arrow-up.prevent="highlightPrevious()"
      @keydown.enter.prevent="chooseHighlighted()"
      @keydown.escape="closeMenu()"
    />
    <button
      type="button"
      class="text-muted-content hover:text-base-content absolute inset-y-0 right-0 flex items-center pr-2"
      aria-label="{{ toggle_label }}"
      @click="open ? closeMenu() : openMenu()"
    >
      <span class="icon-[lucide--chevrons-up-down] h-4 w-4" aria-hidden="true"></span>
    </button>
  </div>
  <div
    x-cloak
    x-show="open"
    class="rounded-box border-base-300 bg-base-100 absolute z-30 max-h-56 w-full overflow-y-auto border p-1 shadow-xl"
    :class="dropUp ? 'bottom-full mb-1' : 'mt-1'"
  >
    <template x-for="(option, index) in filteredOptions()" :key="option.key">
      <button
        type="button"
        class="rounded-field hover:bg-base-200 block w-full px-3 py-2 text-left text-sm"
        :class="selectedKey === option.key || highlightedIndex === index ? 'bg-base-200 font-medium' : ''"
        @mouseenter="highlightedIndex = index"
        @click="choose(option)"
      >
        <span x-text="option.label"></span>
      </button>
    </template>
    <p x-show="filteredOptions().length === 0" class="text-muted-content px-3 py-2 text-sm">
      {{ no_results_text }}
    </p>
  </div>
  <p x-cloak x-show="isInvalid" class="text-error mt-1 text-xs">{{ invalid_message }}</p>
</div>
