name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.4-alpine@sha256:7062a2109c4b51f3c792c7ea01e83ed12ef9a980886e3b3d380a7d2e5f6ce3f5
        env:
          POSTGRES_DB: {{ cookiecutter.project_slug }}
          POSTGRES_USER: {{ cookiecutter.project_slug }}
          POSTGRES_PASSWORD: {{ cookiecutter.project_slug }}
        options: >-
          --health-cmd "pg_isready -U {{ cookiecutter.project_slug }} -d {{ cookiecutter.project_slug }}"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
{% if cookiecutter.rendering_mode in ["ssr", "hybrid"] %}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
{% endif %}
      - name: Prepare environment
        run: cp .env.example .env
      - name: Install Python dependencies
        run: uv sync --all-groups --frozen
{% if cookiecutter.rendering_mode in ["ssr", "hybrid"] %}
      - name: Install frontend dependencies
        run: npm ci
{% endif %}
      - name: Verify generated project
        run: just verify

{% if cookiecutter.rendering_mode in ["ssr", "hybrid"] %}
  e2e:
    needs: quality
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.4-alpine@sha256:7062a2109c4b51f3c792c7ea01e83ed12ef9a980886e3b3d380a7d2e5f6ce3f5
        env:
          POSTGRES_DB: {{ cookiecutter.project_slug }}
          POSTGRES_USER: {{ cookiecutter.project_slug }}
          POSTGRES_PASSWORD: {{ cookiecutter.project_slug }}
        options: >-
          --health-cmd "pg_isready -U {{ cookiecutter.project_slug }} -d {{ cookiecutter.project_slug }}"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: cp .env.example .env
      - run: uv sync --all-groups --frozen && npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv run --env-file .env python manage.py migrate
      - run: uv run --env-file .env python manage.py runserver 127.0.0.1:8000 > server.log 2>&1 &
      - run: npx playwright test
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
{% endif -%}
