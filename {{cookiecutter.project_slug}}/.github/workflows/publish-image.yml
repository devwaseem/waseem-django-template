name: Publish container image with provenance

on:
  workflow_call:
    inputs:
      registry:
        description: Registry host used by the login action, for example ghcr.io.
        required: true
        type: string
      image_name:
        description: Fully qualified image name without a tag.
        required: true
        type: string
      image_tag:
        description: Immutable tag to publish, normally a commit SHA.
        required: true
        type: string
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build, publish, and attest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        if: ${{ '{{' }} secrets.registry_username != '' && secrets.registry_password != '' {{ '}}' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ '{{' }} inputs.registry {{ '}}' }}
          username: ${{ '{{' }} secrets.registry_username {{ '}}' }}
          password: ${{ '{{' }} secrets.registry_password {{ '}}' }}
      - id: build
        name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ '{{' }} inputs.image_name {{ '}}' }}:${{ '{{' }} inputs.image_tag {{ '}}' }}
      - id: sbom
        name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ '{{' }} inputs.image_name {{ '}}' }}@${{ '{{' }} steps.build.outputs.digest {{ '}}' }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ '{{' }} inputs.image_name {{ '}}' }}
          subject-digest: ${{ '{{' }} steps.build.outputs.digest {{ '}}' }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ '{{' }} inputs.image_name {{ '}}' }}
          subject-digest: ${{ '{{' }} steps.build.outputs.digest {{ '}}' }}
          sbom-path: ${{ '{{' }} steps.sbom.outputs.spdx-json {{ '}}' }}
