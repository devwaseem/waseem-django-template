[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_name }}"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django[argon2]>=6.0,<7",
  "django-allauth>=65,<66",
  "django-cors-headers>=4.7,<5",
  "django-csp>=4.0,<5",
  "django-ratelimit>=4.1,<5",
  "django-redis>=6,<7",
  "django-storages[boto3]>=1.14,<2",
  "django-structlog>=9.0,<10",
  "django-stubs-ext>=5.2,<6",
  "django-unfold>=0.74,<1",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-django>=0.60b1,<1",
  "opentelemetry-instrumentation-logging>=0.60b1,<1",
  "opentelemetry-instrumentation-psycopg>=0.60b1,<1",
  "opentelemetry-instrumentation-redis>=0.60b1,<1",
  "opentelemetry-sdk>=1.38,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "redis>=7,<8",
  "sentry-sdk[django]>=2.47,<3",
  "structlog>=25.5,<26",
  "uvicorn[standard]>=0.38,<1",
{% if cookiecutter.rendering_mode in ["ssr", "hybrid"] %}
  "django-cotton>=2.6,<3",
  "hyperdjango>=0.18,<1",
{% endif %}
{% if cookiecutter.rendering_mode in ["api", "hybrid"] %}
  "django-ninja>=1.6,<2",
  "django-ninja-extra>=0.31,<1",
  "django-ninja-jwt>=5.4,<6",
{% endif %}
{% if cookiecutter.enable_celery == "yes" %}
  "celery>=5.6,<6",
  "celery-types>=0.23,<1",
  "opentelemetry-instrumentation-celery>=0.60b1,<1",
{% endif %}
]

[dependency-groups]
dev = [
  "bandit[sarif]>=1.8,<2",
  "basedpyright>=1.38,<2",
  "djlint>=1.36,<2",
  "mkdocs-material>=9.6,<10",
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-django>=4.10,<5",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "{{ cookiecutter.project_slug }}.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov={{ cookiecutter.project_slug }} --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["{{ cookiecutter.project_slug }}"]
omit = [
  "*/migrations/*",
  "*/settings/*",
  "*/asgi.py",
  "*/server.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
skip_empty = true

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportExplicitAny = false
reportAny = false
reportUnusedParameter = false
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportAttributeAccessIssue = "none"
reportIncompatibleMethodOverride = "none"
reportInvalidTypeArguments = "none"
reportAssignmentType = "none"
reportReturnType = "none"
reportCallIssue = "none"
reportArgumentType = "none"
reportUnnecessaryComparison = "none"
reportIncompatibleVariableOverride = "none"
reportMissingTypeArgument = "none"
reportConstantRedefinition = "none"
include = ["{{ cookiecutter.project_slug }}", "{{ cookiecutter.project_slug }}/domains", "manage.py"]
exclude = ["**/migrations", ".venv", "node_modules"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["migrations", ".venv", "node_modules", "staticfiles", "docs"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "S", "SIM", "RUF", "DJ"]
ignore = ["E402", "E501", "RUF012", "S101", "S104", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.project_slug }}", "domains"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100
ignore = "H030,H037"
